<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="8" fill="#0B0F17"/>
  <!-- Outer Astro Ring -->
  <circle cx="16" cy="16" r="10.5" fill="none" stroke="#F59E0B" stroke-width="1.8"/>
  <!-- Inner Ring -->
  <circle cx="16" cy="16" r="5.5" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="2 1.5"/>
  <!-- Meridian Lines -->
  <line x1="16" y1="3" x2="16" y2="29" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="3" y1="16" x2="29" y2="16" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center Star -->
  <circle cx="16" cy="16" r="2.5" fill="#14B8A6"/>
  <circle cx="16" cy="16" r="1" fill="#FFFFFF"/>
</svg>
